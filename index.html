<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Александр — Кассир / Бариста</title>
<meta name="description" content="Александр — кассир / бариста с опытом работы с гостями, кассой, напитками и товаром.">
<meta name="theme-color" content="#151412">
<meta property="og:title" content="Александр — Кассир / Бариста">
<meta property="og:description" content="Александр — кассир / бариста с опытом работы с гостями, кассой, напитками и товаром.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#151412;--bg2:#1d1b18;--line:#2f2c27;--ink:#efece6;--mute:#a09a90;--acc:#d2b072;--accInk:#1a1610;
--font:"Bricolage Grotesque","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--pad:clamp(20px,5vw,56px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 clamp(15px,1.5vw,17px)/1.6 var(--font);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--pad)}
header.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 0 0}
.mark{font-weight:800;letter-spacing:.02em;color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);font:600 14px var(--font);padding:10px 16px;min-width:48px;min-height:44px;cursor:pointer;transition:background .25s,color .25s}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{display:grid;gap:32px;padding:clamp(28px,6vw,72px) 0 clamp(48px,8vw,96px);align-items:center}
@media(min-width:820px){.hero{grid-template-columns:1.1fr .9fr;gap:64px}.hero .photo{order:2}}
.photo{position:relative;aspect-ratio:4/5;max-width:440px;width:100%;justify-self:center;border-radius:200px 200px 16px 16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);box-shadow:0 30px 60px -30px #000}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.photo .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(96px,20vw,180px);font-weight:800;color:var(--line)}
.photo.empty .ph{display:flex}.photo.empty img{display:none}
h1{font-size:clamp(46px,12vw,116px);line-height:.95;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.role{font-size:clamp(20px,3.2vw,30px);font-weight:600;color:var(--acc);margin-top:14px}
.lead{color:var(--mute);max-width:46ch;margin-top:16px}
.pay{display:inline-block;margin-top:24px;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--bg2);border-radius:4px 12px 12px 4px}
.pay b{display:block;font-size:clamp(18px,2.6vw,24px);font-weight:800}
.pay span{color:var(--mute);font-size:.9em}
.trust-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.trust-row span{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:rgba(255,255,255,.025);font-size:.86em}
.section-intro{color:var(--mute);max-width:62ch;margin:-10px 0 26px}
.strengths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.strength{padding:20px;border:1px solid var(--line);background:var(--bg2);border-radius:16px}
.strength b{display:block;font-size:18px;margin-bottom:5px}
.strength span{color:var(--mute)}
@media(max-width:600px){.strengths{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 28px;background:var(--acc);color:var(--accInk);font:800 clamp(15px,2vw,17px) var(--font);letter-spacing:.04em;text-decoration:none;border-radius:999px;transition:transform .25s,background .25s}
.btn:hover{background:#e0c084;transform:translateY(-2px)}
.btn svg{width:22px;height:22px;flex:none}
.cta-row{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.num{color:var(--mute);text-decoration:none;font-weight:600}
.num:hover{color:var(--ink)}
section{padding:clamp(40px,7vw,80px) 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.01em;margin-bottom:28px}
.about p{max-width:62ch;font-size:clamp(17px,2vw,21px);line-height:1.65}
.tl{list-style:none;padding:0;margin-left:6px;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 26px 26px}
.tl li::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.tl h3{font-size:clamp(19px,2.4vw,24px);font-weight:600}
.tl p{color:var(--mute);max-width:60ch}
.chips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.chips li{padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--bg2)}
.langs{list-style:none;padding:0;display:grid;gap:10px;max-width:420px}
.langs li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.langs span{color:var(--mute)}
.final{text-align:center;padding:clamp(56px,9vw,110px) 0}
.final h2{font-size:clamp(32px,7vw,72px);margin-bottom:12px}
.final p{color:var(--mute);margin-bottom:28px}
.final .num{display:block;margin-top:18px;font-size:1.2em;color:var(--ink)}
footer{height:24px}
.bar{display:none}
@media(max-width:819px){
 body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .bar{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(21,20,18,.94);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .35s;z-index:9}
 .bar.on{transform:none}
 .bar .btn{width:100%}
 .hero .btn{width:100%}
}
.fade{opacity:0;transition:opacity .5s}
body.ready .fade{opacity:1}
.sw{transition:opacity .2s}.sw.out{opacity:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.fade{opacity:1}}
</style>
</head>

const $$ = s => document.querySelectorAll(s);
const sw = document.querySelectorAll(".sw");

function render(lang){
 const t = translations[lang];
 document.documentElement.lang = lang;
 document.title = t.title;
 document.querySelector('meta[name=description]').content = t.desc;
 $$("[data-i18n]").forEach(e => { if(t[e.dataset.i18n]!==undefined) e.textContent = t[e.dataset.i18n]; });
 $$("[data-i18n-alt]").forEach(e => e.alt = t[e.dataset.i18nAlt]);
 $$("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t[e.dataset.i18nAria]));
 document.getElementById("tl").innerHTML = t.exp.map(x => `<li><h3></h3><p></p></li>`).join("");
 document.querySelectorAll("#tl li").forEach((li,i)=>{li.firstChild.textContent=t.exp[i][0];li.lastChild.textContent=t.exp[i][1];});
 const chips = document.getElementById("chips"); chips.innerHTML="";
 t.skills.forEach(s => { const li=document.createElement("li"); li.textContent=s; chips.appendChild(li); });
 $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
}
function setLang(lang){
 sw.forEach(e => e.classList.add("out"));
 setTimeout(() => {
  render(lang);
  try{ localStorage.setItem("lang", lang); }catch(e){}
  document.querySelectorAll(".sw").forEach(e => e.classList.remove("out"));
 }, 180);
}

$$(".callLink").forEach(a => { a.href = "tel:" + PHONE; a.target = "_top"; });

$$(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

let saved = "ru";
try{ const s = localStorage.getItem("lang"); if(s==="ru"||s==="uz") saved = s; }catch(e){}
render(saved);

// Фото: если assets/photo.jpg нет — показывается монограмма
const photo = document.getElementById("photo"), img = photo.querySelector("img");
img.addEventListener("error", () => photo.classList.add("empty"));
if(img.complete && img.naturalWidth===0) photo.classList.add("empty");

// Нижняя CTA-панель на мобильных: показывать после первого экрана, скрывать у финального блока
const bar = document.getElementById("bar");
let heroOut=false, finalIn=false;
const upd = () => bar.classList.toggle("on", heroOut && !finalIn);
if("IntersectionObserver" in window){
 new IntersectionObserver(e => { heroOut = !e[0].isIntersecting; upd(); }).observe(document.querySelector(".hero .btn"));
 new IntersectionObserver(e => { finalIn = e[0].isIntersecting; upd(); }).observe(document.getElementById("final"));
} else bar.classList.add("on");

requestAnimationFrame(() => document.body.classList.add("ready"));
